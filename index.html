<section id="appointment" class="appointment_wrapper wrapper py-5">
  <div class="container">
    <div class="row">
      <div class="col-sm-12 text-center mb-5">
        <h3 class="text-primary">Book an Appointment</h3>
        <p>Schedule your visit with our experienced medical professionals.</p>
      </div>
    </div>

    <!-- Alert Message -->
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div id="appointmentAlert" class="alert alert-info alert-dismissible fade show d-none" role="alert">
          Appointment request sent! We will confirm via email/phone shortly.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <!-- Appointment Form -->
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <form id="appointmentForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <input type="text" class="form-control" placeholder="Full Name" id="patientName" required>
            </div>
            <div class="col-md-6 mb-3">
              <input type="tel" class="form-control" placeholder="Phone Number" id="phone" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <input type="email" class="form-control" placeholder="Email" id="email" required>
            </div>
            <div class="col-md-6 mb-3">
              <select class="form-select" id="department" required>
                <option selected disabled>Choose Department</option>
                <option>Cardiology</option>
                <option>Neurology</option>
                <option>Orthopedics</option>
                <option>Pediatrics</option>
                <option>Dermatology</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <input type="date" class="form-control" id="date" required>
            </div>
            <div class="col-md-6 mb-3">
              <input type="time" class="form-control" id="time" required>
            </div>
          </div>

          <div class="mb-3">
            <textarea class="form-control" id="symptoms" rows="4" placeholder="Describe your symptoms or concern"></textarea>
